services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yiedie
      POSTGRES_PASSWORD: yiedie_local
      POSTGRES_DB: yiedie
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - yiedie_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yiedie -d yiedie"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  yiedie_postgres:
